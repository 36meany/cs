<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d14">
<title>КЕЙСЕР — CS2 Case Simulator</title>
<script src="https://yandex.ru/games/sdk/v2"></script>

</head>
<body>
<div class="bg-layer"></div><div class="bg-overlay"></div>
<div id="app">

<nav class="nav" id="nav"><button data-view="cases" class="nav-btn active">Кейсы</button><button data-view="inventory" class="nav-btn">Инвентарь</button><button data-view="upgrade" class="nav-btn">Апгрейд</button><button data-view="stats" class="nav-btn">Статистика</button><button data-view="profile" class="nav-btn">Профиль</button></nav>

<div id="modalRoot"></div><div id="toasts"></div><div id="particles"></div>
<script src="src/js/config.js"></script><script src="src/js/state.js"></script><script src="src/js/utils.js"></script><script src="src/js/audio.js"></script><script src="src/js/storage.js"></script><script src="src/js/sdk.js"></script><script src="src/js/ui/particles.js"></script><script src="src/js/ui/animations.js"></script><script src="src/js/ui/toasts.js"></script><script src="src/js/ui/modals.js"></script><script src="src/js/game/economy.js"></script><script src="src/js/game/cases.js"></script><script src="src/js/game/inventory.js"></script><script src="src/js/game/upgrade.js"></script><script src="src/js/game/achievements.js"></script><script src="src/js/views/cases.js"></script><script src="src/js/views/inventory.js"></script><script src="src/js/views/upgrade.js"></script><script src="src/js/views/stats.js"></script><script src="src/js/views/profile.js"></script><script src="src/js/app.js"></script>
